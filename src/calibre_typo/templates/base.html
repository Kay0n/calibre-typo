<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} - Calibre Typo</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{{ url_for('review.index') }}">
        <span class="brand-mark" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </span>
        <span class="brand-text">Calibre Typo</span>
      </a>
      {% if is_logged_in() %}
      <nav>
        <a class="nav-link {{ 'active' if request.blueprint == 'review' }}" href="{{ url_for('review.index') }}">Books</a>
        <a class="nav-link {{ 'active' if request.blueprint == 'devices' }}" href="{{ url_for('devices.index') }}">Devices</a>
        <a class="nav-link {{ 'active' if request.endpoint == 'auth.account' }}" href="{{ url_for('auth.account') }}">Account</a>
        {% if login_enabled() %}
        <form method="post" action="{{ url_for('auth.logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="ghost sm">Log out</button>
        </form>
        {% endif %}
      </nav>
      {% endif %}
    </div>
  </header>
  <main>
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="flash {{ category }}" role="status">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
